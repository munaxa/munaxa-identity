# Munaxa staging — three services behind one public origin.
#
# Not a development compose file. Nothing here publishes a database port, nothing carries a default
# credential, and every Identity secret is a mounted file rather than an environment literal: an env
# var is visible to `docker inspect`, to every process in the container and to any crash reporter
# that dumps the environment, which for a signing key is the whole compromise.
#
# **Databases are not defined here.** Both are provisioned outside this file — a managed PostgreSQL
# in staging, as Munaxa School does — for two reasons that matter more than convenience: migrations
# must run as a *different role* from the one the services connect as, which is an ordering a
# compose file cannot express; and a database whose lifecycle is tied to `docker compose down` is a
# database somebody will eventually delete by tidying up. See docs/runbooks/staging-provisioning.md,
# which must be completed before this file is used.
#
# The front door is what makes the `__Host-` session cookie work at all. It is one origin the
# browser sees; the three services behind it stay separate products with separate databases.

name: munaxa-staging

secrets:
  # Docker secrets are files. Identity reads each through its `*_FILE` convention, so no secret is
  # ever an environment literal in this file or in the running container's environment.
  #
  # `npm_token` is a *build* secret, not a runtime one: BuildKit mounts it for the install step and
  # it never reaches a layer. It is declared here because compose requires every secret a service
  # names to be defined at the top level — a build secret included, which is easy to miss and
  # fails the whole project rather than just the build.
  npm_token: { environment: NODE_AUTH_TOKEN }
  identity_signing_private_key: { file: ./secrets/identity_signing_private_key.pem }
  identity_signing_secret: { file: ./secrets/identity_signing_secret }
  identity_database_url: { file: ./secrets/identity_database_url }
  # The cache credential, and the two connection strings that embed it. Three files rather than one
  # because the password alone is what redis-server needs, and a URL is what a client needs; deriving
  # one from the other inside a container means the password passes through a shell.
  redis_password: { file: ./secrets/redis_password }
  identity_redis_url: { file: ./secrets/identity_redis_url }

services:
  front-door:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['443:443', '80:80']
    environment:
      # The site address Caddy serves and obtains a certificate for. A host, not a URL:
      # `PUBLIC_ORIGIN` is `https://<host>` and this is `<host>`.
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST, the public hostname this origin answers on}
    volumes:
      # `Caddyfile.tls` is the form that terminates its own TLS, which is what this topology needs:
      # Caddy holds 80 and 443 here and obtains the certificate over ACME. The Render image bakes
      # `Caddyfile` instead, which listens on $PORT and issues nothing, because Render's edge has
      # already terminated HTTPS. Both import the same routing snippet, so the path split is one
      # definition rather than two that have to be kept in step.
      - ./Caddyfile.tls:/etc/caddy/Caddyfile:ro
      - ./caddy-routes.caddyfile:/etc/caddy/caddy-routes.caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    # Health conditions, not bare `depends_on`. Started-but-not-ready is the state that produces a
    # front door serving 502s to the first users through the door after every deploy.
    depends_on:
      identity: { condition: service_healthy }
      work-api: { condition: service_healthy }
      work-admin: { condition: service_started }

  identity:
    # An immutable, already-published reference — a digest or a commit-SHA tag, never `latest`. The
    # `build` block below it is the recipe that produced it, kept so `docker compose build` still
    # works; `up` uses the image. Deploying a tag that can move means two hosts running "the same
    # version" and disagreeing about what that is.
    image: ${IDENTITY_IMAGE:?set IDENTITY_IMAGE to a published digest or commit-SHA tag}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      secrets: [npm_token]
    restart: unless-stopped
    # No `ports`: reachable only through the front door, only on the internal network.
    expose: ['4001']
    secrets:
      [
        identity_signing_private_key,
        identity_signing_secret,
        identity_database_url,
        identity_redis_url,
      ]
    # The databases live outside this file (see the header). When they are on the same host as the
    # compose project rather than on a managed endpoint, this is the name that reaches them: a
    # container's `127.0.0.1` is its own loopback, not the host's, which is the mistake that produces
    # ECONNREFUSED against a database that is plainly running. Harmless when the connection string
    # names a managed endpoint instead — nothing resolves a name it never uses.
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      NODE_ENV: production
      PORT: '4001'
      IDENTITY_SIGNING_PRIVATE_KEY_FILE: /run/secrets/identity_signing_private_key
      IDENTITY_SIGNING_SECRET_FILE: /run/secrets/identity_signing_secret
      DATABASE_URL_FILE: /run/secrets/identity_database_url
      # This exact string becomes the `iss` claim, and Munaxa Work compares it character for
      # character. It is the public URL, never an internal address.
      IDENTITY_BASE_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN, e.g. https://$PUBLIC_HOST}/api/auth
      IDENTITY_AUTH_AUDIENCE: munaxa-work
      IDENTITY_SIGNING_ALGORITHM: ES256
      IDENTITY_SIGNING_KID: ${IDENTITY_SIGNING_KID:?set IDENTITY_SIGNING_KID, e.g. identity-staging-2026-09}
      IDENTITY_DEFAULT_ORGANISATION: ${IDENTITY_DEFAULT_ORGANISATION:-}
      CSRF_TRUSTED_ORIGINS: ${PUBLIC_ORIGIN}
      REDIS_URL_FILE: /run/secrets/identity_redis_url
      LOG_PRETTY: 'false'
      APP_VERSION: ${IDENTITY_VERSION:-0.1.0}
      BUILD_SHA: ${IDENTITY_BUILD_SHA:-unknown}
    depends_on:
      cache: { condition: service_healthy }
    # The image declares this too; it is repeated here because the compose health *conditions*
    # above depend on it and a reader should not have to open the Dockerfile to see why.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4001/api/auth/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    # Lockout counters, the permission cache and rate limits. Not published, and not persisted:
    # everything on it is reconstructible, and a persisted cache is a file of session-shaped data
    # nobody is watching.
    #
    # The password is written into a config file at start rather than passed as `--requirepass <pw>`.
    # An argument is not a hiding place: it shows in `docker inspect`, in `ps` on the host, and in
    # every process listing inside the container. Redis reads the generated file and the password
    # never appears in a command line.
    #
    # No TLS on this hop. It carries lockout counters and cached permission sets over a private
    # compose network that is not published to any interface, and terminating TLS here would mean a
    # second certificate lifecycle for a link no packet can reach from outside the host. If the cache
    # is ever moved off-host that decision changes and this comment is the place it is recorded.
    secrets: [redis_password]
    command:
      - sh
      - -c
      - >-
        umask 077 &&
        printf 'requirepass %s\nsave ""\nappendonly no\n' "$$(cat /run/secrets/redis_password)" > /tmp/redis.conf &&
        exec redis-server /tmp/redis.conf
    expose: ['6379']
    healthcheck:
      # REDISCLI_AUTH rather than `-a`, for the same reason the server reads a file: `-a` puts the
      # password in the argument list of a process that runs every ten seconds.
      test:
        [
          'CMD-SHELL',
          'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -q PONG',
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  work-api:
    image: ${WORK_API_IMAGE:?set WORK_API_IMAGE}
    restart: unless-stopped
    expose: ['3000']
    # The databases live outside this file (see the header). When they are on the same host as the
    # compose project rather than on a managed endpoint, this is the name that reaches them: a
    # container's `127.0.0.1` is its own loopback, not the host's, which is the mistake that produces
    # ECONNREFUSED against a database that is plainly running. Harmless when the connection string
    # names a managed endpoint instead — nothing resolves a name it never uses.
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      NODE_ENV: production
      # Munaxa Work's configuration contract is `DATABASE_URL`; it has no `*_FILE` convention, and
      # adding one would be a change to another product for this file's convenience. On a platform
      # with secret injection this is a secret-backed variable; under plain compose it comes from
      # the operator's shell, never from a committed file.
      DATABASE_URL: ${WORK_DATABASE_URL:?set WORK_DATABASE_URL from your secret store}
      PII_MATCH_SECRET: ${WORK_PII_MATCH_SECRET:?set WORK_PII_MATCH_SECRET from your secret store}
      # Same reasoning as DATABASE_URL above: Work has no `*_FILE` convention, so this comes from the
      # operator's shell or the platform's secret injection, never from a committed file.
      REDIS_URL: ${WORK_REDIS_URL:?set WORK_REDIS_URL, including the cache password}
      # The public half of Identity's signing key. Not a secret, and deliberately configured rather
      # than fetched: Platform publishes no JWKS endpoint, so this is the only mechanism there is.
      PLATFORM_AUTH_ISSUER: ${PUBLIC_ORIGIN}/api/auth
      PLATFORM_AUTH_AUDIENCE: munaxa-work
      PLATFORM_AUTH_ALGORITHM: ES256
      PLATFORM_AUTH_PUBLIC_KEYS: ${PLATFORM_AUTH_PUBLIC_KEYS:?set PLATFORM_AUTH_PUBLIC_KEYS to Identity's public key}
      # Provenance in the logs. Without these Work reports version 0.0.0, and a log line that
      # cannot be tied back to a commit is a log line you cannot act on during an incident.
      APP_VERSION: ${WORK_VERSION:-0.1.0}
      BUILD_SHA: ${WORK_BUILD_SHA:-unknown}
    depends_on:
      cache: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        # `/health/ready`, deliberately *without* the `API_PREFIX`. Munaxa Work excludes the health
        # controller from its global prefix and from versioning so that an orchestrator's probe URL
        # does not move when the API version does — so the prefixed path is the one that 404s, and
        # a probe pointed at it leaves work-api permanently unhealthy and the front door, which
        # waits on it, never starting at all.
        - "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

  work-admin:
    image: ${WORK_ADMIN_IMAGE:?set WORK_ADMIN_IMAGE}
    restart: unless-stopped
    expose: ['3001']
    environment:
      NODE_ENV: production
      # Server-to-server, inside the compose network. The browser never calls the API directly.
      WORK_API_URL: http://work-api:3000
      PLATFORM_SIGN_IN_URL: ${PUBLIC_ORIGIN}/api/auth/login
    depends_on:
      work-api: { condition: service_healthy }

volumes:
  caddy-data:
  caddy-config:

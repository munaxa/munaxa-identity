# Publishing Munaxa Identity's images to Amazon ECR for the shared AWS stack (munaxa-platform
# infra/aws), so an ECS deployment pulls an artifact built and checked here, pinned by digest.
#
#   munaxa-identity/api      apps/api/Dockerfile, target runtime
#   munaxa-identity/migrate  apps/api/Dockerfile, target migrate (the release job)
#
# publish-images.yml (GHCR, for Render) is left as it is until the AWS deployment is validated and
# Render is retired. Only this workflow runs on an image/* tag; the GHCR one is dispatch-only (#6).
#
# **Tag-triggered, and the tag names the commit.** A tag `image/<40-hex commit SHA>` on a commit
# that is on `main`. The jobs that touch ECR run in the protected `image-release` environment and
# assume this repository's image publisher role through GitHub OIDC; the role's trust requires that
# environment and an image/* tag, and it may push only to this product's repositories. No registry
# credential exists.
#
# **No `latest`.** Two immutable tags per image (`<short>`, `sha-<full>`) and the digest, which is
# what the stack's tfvars name. Inert until the owner sets the repository variable
# AWS_IMAGE_PUBLISHER_ROLE_ARN (munaxa-platform infra/aws/README.md, gate G2).

name: Publish images to ECR

on:
  push:
    tags:
      - 'image/**'

concurrency:
  group: publish-ecr-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-finished push to a registry

permissions:
  contents: read

env:
  AWS_REGION: eu-central-1
  REGISTRY: 229251310592.dkr.ecr.eu-central-1.amazonaws.com

jobs:
  source:
    name: Resolve the source commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
    steps:
      - name: Read the commit from the tag name
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha="${REF_NAME#image/}"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::tag must be image/<40-hex commit SHA>, got '$REF_NAME'"; exit 1
          fi
          if [ "$GITHUB_SHA" != "$sha" ]; then
            echo "::error::tag $REF_NAME points at $GITHUB_SHA, not at the commit it names"; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the commit is on main (reviewed history)
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }

  publish:
    name: ${{ matrix.repository }}
    needs: source
    runs-on: ubuntu-latest
    environment: image-release # required reviewer; the publisher role trusts only this subject
    permissions:
      contents: read
      packages: read # @munaxa/* from GitHub Packages, during the build only
      id-token: write # GitHub OIDC, for the image publisher role
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: munaxa-identity/api
            target: runtime
          - repository: munaxa-identity/migrate
            target: migrate
    env:
      SHA: ${{ needs.source.outputs.sha }}
      SHORT: ${{ needs.source.outputs.short }}
    steps:
      - name: Refuse to run before the publisher role exists
        env:
          ROLE: ${{ vars.AWS_IMAGE_PUBLISHER_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "::error::AWS_IMAGE_PUBLISHER_ROLE_ARN is not set (munaxa-platform infra/aws, gate G2)"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Assume the image publisher role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUBLISHER_ROLE_ARN }}
          role-session-name: gha-publish-${{ github.run_id }}
          role-duration-seconds: 3600
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '229251310592'

      - name: Sign in to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      # Built and loaded locally first, verified and scanned, and only then pushed: an image with a
      # HIGH or CRITICAL finding (5a5994f carried CVE-2026-4738) never reaches ECR again.
      - name: Build (not pushed yet)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: true
          provenance: false # a single-platform manifest, so the digest names the image
          sbom: false
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.repository }}:${{ env.SHORT }}
            ${{ env.REGISTRY }}/${{ matrix.repository }}:sha-${{ env.SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          # The registry credential for @munaxa/* as a BuildKit secret, never a build argument.
          secrets: |
            npm_token=${{ secrets.PLATFORM_PACKAGES_TOKEN }}

      - name: Verify and scan before pushing
        env:
          REPOSITORY: ${{ matrix.repository }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          REF="$REGISTRY/$REPOSITORY:sha-$SHA"
          .github/scripts/verify-image.sh "$REF" "$TARGET"
          .github/scripts/scan-image.sh "$REF" "identity-$TARGET" image-reports

      - name: Keep the SBOM and scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-reports-${{ matrix.target }}
          path: image-reports/
          if-no-files-found: warn
          retention-days: 400

      - name: Push
        id: build
        env:
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          repo="$REGISTRY/$REPOSITORY"
          docker push -q "$repo:$SHORT" >/dev/null
          docker push -q "$repo:sha-$SHA" >/dev/null
          digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$repo:sha-$SHA" | sed -n "s#^$repo@##p" | head -n1)"
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "::error::no pushed digest for $repo"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # The exact digest that was pushed, pulled back and checked again. A failure here leaves the
      # image in ECR (tags are immutable) but marks the release failed, so nobody pins it.
      - name: Verify the pushed image
        env:
          REPOSITORY: ${{ matrix.repository }}
          TARGET: ${{ matrix.target }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          REF="$REGISTRY/$REPOSITORY@$DIGEST"
          docker rmi -f "$REGISTRY/$REPOSITORY:sha-$SHA" "$REGISTRY/$REPOSITORY:$SHORT" >/dev/null
          docker pull -q "$REF" >/dev/null
          .github/scripts/verify-image.sh "$REF" "$TARGET"
          {
            echo "### $REPOSITORY"
            echo "\`$REF\` from \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

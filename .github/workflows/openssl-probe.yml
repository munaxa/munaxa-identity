# TEMPORARY diagnostic (D-SSL, 21 Nov 2026). Read-only: pulls public images, queries Alpine's
# package index and the Grype database. Builds and pushes nothing, uses no secret.
# The PR that carries this file is closed unmerged once the evidence is recorded.
name: openssl-probe
on:
  pull_request:
    paths: ['.github/workflows/openssl-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Round 3, who links the system OpenSSL, and the advisory severities
        run: |
          PIN=node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
          docker run --rm "$PIN" sh -c 'echo "-- ldd node"; ldd /usr/local/bin/node; node -p "process.versions.openssl"; echo "-- files linking libssl/libcrypto"; for f in $(find / -xdev -type f \( -name "*.so*" -o -perm -u+x \) 2>/dev/null); do ldd "$f" 2>/dev/null | grep -qE "libssl|libcrypto" && echo "$f"; done'
          curl -sSfL https://openssl-library.org/news/secadv/20261117.txt | grep -E '^[A-Z].*\(CVE-[0-9-]+\)$|^Severity:|^OpenSSL 3.5 users|^OpenSSL [0-9.]+(, [0-9.]+)*( and [0-9.]+)? (are|is) (vulnerable|not affected)|scheduled|^for '

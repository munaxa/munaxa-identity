# Publishing the Identity runtime image to Amazon ECR, for the AWS staging environment.
#
# ECS pulls from ECR with its task execution role — IAM, no registry password to store or rotate —
# which is why ECR rather than private GHCR. This workflow holds no AWS credential either: it assumes
# an IAM role through GitHub's OIDC provider, for this run only, and that role may push to one
# repository and nothing else. Everything AWS-specific is a GitHub *environment variable* on the
# `aws-staging` environment, not a value in this file: see docs/runbooks/ecr-image.md for the role,
# its trust policy, the repository and the variables.
#
# The Render/GHCR workflow (publish-images.yml) is unchanged; the image built here is the same
# Dockerfile, the same build, and the same checks.
#
# Deliberate trigger only, like the GHCR one: a tag `ecr/<anything>` on the commit to publish, or a
# dispatch naming it. The output is an immutable `repository@sha256:…` reference; that, and never a
# tag, is what an ECS task definition uses.

name: Publish image to ECR

on:
  push:
    tags:
      - 'ecr/**'
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to build. Defaults to the ref this runs on.'
        required: false
        type: string

concurrency:
  group: publish-ecr-${{ inputs.commit || github.sha }}
  cancel-in-progress: false # never cancel a half-finished push to a registry

# The minimum: read the repository, request an OIDC token, read the @munaxa/* packages with the
# per-run token when the packages grant this repository access.
permissions:
  contents: read
  id-token: write
  packages: read

jobs:
  publish:
    name: identity-api → ECR
    runs-on: ubuntu-latest
    # The OIDC subject becomes `repo:<owner>/munaxa-identity:environment:aws-staging`, which is what
    # the role's trust policy names. The environment's protection rules decide which tags and
    # branches may publish, and who must approve.
    environment: aws-staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - name: Require the environment's configuration
        run: |
          missing=""
          for name in AWS_REGION AWS_ROLE_ARN ECR_REPOSITORY; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Set these variables on the aws-staging environment:$missing (docs/runbooks/ecr-image.md)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # The commit to build. `.github/` and `deploy/` are outside the runtime image, so a commit
          # that only touches them produces a byte-identical image to the one it sits on.
          ref: ${{ inputs.commit || github.sha }}

      - name: Record what is being built
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)"            >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Assume the publishing role (OIDC, no stored AWS credential)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: identity-ecr-${{ github.run_id }}
          role-duration-seconds: 3600

      - name: Authenticate to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: Is this commit already published?
        id: existing
        env:
          TAG: sha-${{ steps.source.outputs.sha }}
        run: |
          # Tags are immutable in the repository, so a re-run for a commit already pushed must not
          # try to push it again — it would fail on the tag. It reports the existing digest instead.
          digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)
          if [ -n "$digest" ] && [ "$digest" != "None" ]; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "Already published: $TAG → $digest"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.digest == ''

      - name: Build and push
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          # Fargate tasks are declared X86_64; stated rather than inherited from the runner.
          platforms: linux/amd64
          push: true
          # Commit tags for traceability; no `latest`. Deployment uses the digest, never a tag.
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${{ steps.source.outputs.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.source.outputs.short }}
          # Mounted for the install layers only; absent from every layer's filesystem and history.
          # The per-run token suffices once the @munaxa/* packages grant this repository read access;
          # until then the existing PLATFORM_PACKAGES_TOKEN is used.
          secrets: |
            npm_token=${{ secrets.PLATFORM_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          # A single-platform image manifest, so the digest names the image itself.
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.short }}

      - name: Resolve the immutable reference
        id: ref
        env:
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::no image digest was produced; nothing pinnable exists"; exit 1 ;;
          esac
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY/$ECR_REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Verify the image ECS will run
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
        run: |
          docker pull "$IMAGE"
          sh .github/scripts/verify-runtime-image.sh "$IMAGE"

      - name: Summary
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.ref.outputs.digest }}
          REUSED: ${{ steps.existing.outputs.digest != '' }}
        run: |
          {
            echo "### identity-api → ECR"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| commit | \`${{ steps.source.outputs.sha }}\` |"
            echo "| digest | \`$DIGEST\` |"
            echo "| already published | $REUSED |"
            echo "| run | ${{ github.run_id }} |"
            echo ""
            echo "ECS task definition \`image\` (service and one-off tasks alike):"
            echo ""
            echo "\`\`\`"
            echo "$IMAGE"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
